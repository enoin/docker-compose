services:
  mysql-backup:
    image: alpine:3.19
    container_name: mysql-backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
      SCP_USER: ${SCP_USER:-user}
      SCP_HOST: ${SCP_HOST:-remote-vm}
      SCP_PORT: ${SCP_PORT:-22}
      SCP_TARGET_DIR: ${SCP_TARGET_DIR:-/backups}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      RETAIN_DAYS: ${RETAIN_DAYS:-7}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    volumes:
      - ./backup.sh:/backup.sh
      - ./ssh:/root/.ssh:ro
      - ./data:/tmp/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache mysql-client openssh-client dcron curl && \
        echo "$$BACKUP_CRON sh /backup.sh >> /var/log/backup.log 2>&1" | crontab - && \
        crond -f -l 2

# exec in running container:
# docker compose exec mysql-backup sh /backup.sh
# docker exec mysql-backup /backup.sh
# docker compose run --rm -T --entrypoint="" mysql-backup sh /backup.sh
