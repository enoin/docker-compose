version: "3.8"

x-environment: &glitchtip-env
  DATABASE_URL: postgresql://glitchtip:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
  SECRET_KEY: ${SECRET_KEY}
  PORT: 8080
  EMAIL_URL: ${EMAIL_URL:-consolemail://}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-glitchtip@localhost}
  CELERY_WORKER_AUTOSCALE: "1,3"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *glitchtip-env
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8080"

  worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *glitchtip-env
      REDIS_URL: redis://redis:6379/0

  migrate:
    image: glitchtip/glitchtip:latest
    command: ./manage.py migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *glitchtip-env
    restart: "no"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # uncomment when SSL cert is ready
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro   # uncomment for SSL
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
